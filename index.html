<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Live Price</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #080d19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      padding: 18px 4px 28px;
    }

    .brand {
      color: #60a5fa;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0 6px;
      font-size: 28px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
    }

    .card {
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid #253047;
      border-radius: 20px;
      background: #111a2b;
    }

    .label {
      color: #94a3b8;
      font-size: 13px;
    }

    .price {
      margin: 18px 0;
      font-size: clamp(32px, 9vw, 48px);
      font-weight: 750;
      letter-spacing: -1px;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 20px;
      background: #1c293b;
      color: #cbd5e1;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
    }

    .info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #253047;
      font-size: 13px;
    }

    .info:last-child {
      border-bottom: none;
    }

    .info span:first-child {
      color: #94a3b8;
    }

    .info span:last-child {
      text-align: right;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 20px 4px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="brand">LIVE MARKET DASHBOARD</div>
      <h1>Deriv Live Price</h1>
      <div class="subtitle">
        Real-time data connection monitor
      </div>
    </header>

    <section class="card">
      <div class="label">Latest received price</div>

      <div class="price" id="price">Waiting for data...</div>

      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="connectionStatus">Connecting...</span>
      </div>
    </section>

    <section class="card">
      <div class="info">
        <span>Data source</span>
        <span>Deriv WebSocket</span>
      </div>

      <div class="info">
        <span>Last update</span>
        <span id="lastUpdate">Not received yet</span>
      </div>

      <div class="info">
        <span>Connection</span>
        <span id="connectionDetail">Initializing</span>
      </div>
    </section>

    <footer>
      Live data monitor · Connection status is not a trading signal
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
