<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Live Market</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #0b1220;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border: 1px solid #263449;
      border-radius: 22px;
      background: #111c2e;
      box-shadow: 0 18px 55px #0005;
    }

    .brand {
      color: #36d6a5;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 6px;
      font-size: 27px;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #96a8c0;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #b8c6d9;
      font-size: 13px;
    }

    select {
      width: 100%;
      padding: 15px;
      border: 1px solid #34465f;
      border-radius: 12px;
      outline: none;
      background: #0b1424;
      color: white;
      font-size: 15px;
    }

    .market-card {
      margin-top: 22px;
      padding: 22px;
      border: 1px solid #2b3c52;
      border-radius: 16px;
      background: #0b1424;
    }

    .market-name {
      color: #c3d0e0;
      font-size: 16px;
      font-weight: bold;
    }

    .symbol {
      margin-top: 7px;
      color: #8499b4;
      font-size: 13px;
    }

    .price-label {
      margin-top: 30px;
      color: #91a4bc;
      font-size: 13px;
    }

    .price {
      margin-top: 8px;
      font-size: clamp(34px, 9vw, 48px);
      font-weight: bold;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 22px;
      color: #c1cddd;
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f5b942;
      flex-shrink: 0;
    }

    .dot.connected {
      background: #36d6a5;
    }

    .dot.error {
      background: #ff6878;
    }

    .updated {
      margin-top: 12px;
      color: #8193ab;
      font-size: 12px;
    }

    .note {
      margin-top: 22px;
      color: #8193ab;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="dashboard">
    <div class="brand">Deriv Market Data</div>
    <h1>Live Price</h1>
    <p class="subtitle">Real-time market prices</p>

    <label for="marketSelect">Select market</label>

    <select id="marketSelect">
      <option value="1HZ25V">Volatility 25 (1s) Index</option>
      <option value="1HZ10V">Volatility 10 (1s) Index</option>
      <option value="1HZ15V">Volatility 15 (1s) Index</option>
      <option value="1HZ30V">Volatility 30 (1s) Index</option>
      <option value="1HZ50V">Volatility 50 (1s) Index</option>
      <option value="1HZ75V">Volatility 75 (1s) Index</option>
      <option value="1HZ90V">Volatility 90 (1s) Index</option>
      <option value="R_10">Volatility 10 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_100">Volatility 100 Index</option>
      <option value="BOOM1000">Boom 1000 Index</option>
      <option value="BOOM500">Boom 500 Index</option>
      <option value="CRASH1000">Crash 1000 Index</option>
      <option value="CRASH500">Crash 500 Index</option>
      <option value="stpRNG">Step Index</option>
      <option value="frxEURUSD">EUR/USD</option>
      <option value="frxGBPUSD">GBP/USD</option>
      <option value="frxUSDJPY">USD/JPY</option>
      <option value="cryBTCUSD">BTC/USD</option>
      <option value="cryETHUSD">ETH/USD</option>
      <option value="frxXAUUSD">Gold/USD</option>
    </select>

    <section class="market-card">
      <div class="market-name" id="marketName">
        Volatility 25 (1s) Index
      </div>

      <div class="symbol">
        Symbol: <span id="symbol">1HZ25V</span>
      </div>

      <div class="price-label">Current price</div>
      <div class="price" id="price">Waiting...</div>

      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span id="status">Connecting to market...</span>
      </div>

      <div class="updated">
        Last update: <span id="updated">—</span>
      </div>
    </section>

    <p class="note">
      Read-only market data. This dashboard does not place trades.
    </p>
  </main>

  <script>
    const marketSelect = document.getElementById("marketSelect");
    const marketName = document.getElementById("marketName");
    const symbolElement = document.getElementById("symbol");
    const priceElement = document.getElementById("price");
    const statusElement = document.getElementById("status");
    const statusDot = document.getElementById("statusDot");
    const updatedElement = document.getElementById("updated");

    let socket = null;
    let selectedSymbol = marketSelect.value;
    let subscriptionId = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 12;
    let pingInterval = null;

    function setStatus(message, state = "connecting") {
      statusElement.textContent = message;
      statusDot.className = "dot";
      if (state === "connected") {
        statusDot.classList.add("connected");
      } else if (state === "error") {
        statusDot.classList.add("error");
      }
    }

    function connect() {
      // Clean up previous connection
      if (socket) {
        socket.onopen = null;
        socket.onmessage = null;
        socket.onerror = null;
        socket.onclose = null;
        try { socket.close(); } catch (e) {}
      }

      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }

      // Official public endpoint (no app_id needed)
      socket = new WebSocket("wss://api.derivws.com/trading/v1/options/ws/public");

      setStatus("Connecting...", "connecting");
      priceElement.textContent = "Waiting...";

      socket.addEventListener("open", () => {
        console.log("✅ WebSocket connected");
        reconnectAttempts = 0;
        setStatus("Connected — loading price");
        subscribeToMarket(selectedSymbol);

        // Keep-alive ping every 30 seconds
        pingInterval = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ ping: 1 }));
          }
        }, 30000);
      });

      socket.addEventListener("message", (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (error) {
          console.error("Failed to parse message:", event.data);
          return;
        }

        // Handle API errors
        if (data.error) {
          console.error("Deriv API error:", data.error);
          setStatus(data.error.message || "API Error", "error");
          priceElement.textContent = "Unavailable";
          return;
        }

        // Handle tick data
        if (data.msg_type === "tick" && data.tick) {
          // Ignore ticks from other symbols
          if (data.tick.symbol !== selectedSymbol) return;

          if (data.subscription && data.subscription.id) {
            subscriptionId = data.subscription.id;
          }

          const decimals = Number(data.tick.pip_size ?? 2);
          priceElement.textContent = Number(data.tick.quote).toFixed(decimals);
          updatedElement.textContent = new Date().toLocaleTimeString();
          setStatus("Live price connected", "connected");
        }
      });

      socket.addEventListener("error", (err) => {
        console.error("WebSocket error event:", err);
        setStatus("Connection error", "error");
      });

      socket.addEventListener("close", (event) => {
        console.log("WebSocket closed:", event.code, event.reason);
        subscriptionId = null;
        setStatus("Disconnected — reconnecting...", "error");

        if (pingInterval) {
          clearInterval(pingInterval);
          pingInterval = null;
        }

        // Auto reconnect with exponential backoff
        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
          const delay = Math.min(1000 * Math.pow(1.8, reconnectAttempts), 16000);
          reconnectAttempts++;
          console.log(`Reconnecting in ${Math.round(delay)}ms (attempt ${reconnectAttempts})`);
          setTimeout(connect, delay);
        } else {
          setStatus("Failed to reconnect. Please refresh the page.", "error");
        }
      });
    }

    function subscribeToMarket(symbol) {
      selectedSymbol = symbol;

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        priceElement.textContent = "Loading...";
        setStatus("Connecting to market...");
        return;
      }

      // Unsubscribe from previous stream
      if (subscriptionId) {
        socket.send(JSON.stringify({ forget: subscriptionId }));
        subscriptionId = null;
      }

      priceElement.textContent = "Loading...";
      updatedElement.textContent = "—";
      setStatus("Loading " + symbol + "...");

      socket.send(JSON.stringify({
        ticks: symbol,
        subscribe: 1
      }));
    }

    function updateSelectedMarket() {
      const option = marketSelect.options[marketSelect.selectedIndex];
      marketName.textContent = option.textContent;
      symbolElement.textContent = marketSelect.value;
      selectedSymbol = marketSelect.value;

      if (socket && socket.readyState === WebSocket.OPEN) {
        subscribeToMarket(selectedSymbol);
      } else {
        priceElement.textContent = "Loading...";
        setStatus("Connecting to market...");
      }
    }

    // Start connection when page loads
    connect();

    // Handle market changes
    marketSelect.addEventListener("change", updateSelectedMarket);
  </script>
</body>
</html>
