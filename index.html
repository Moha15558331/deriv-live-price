<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Price Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #0b1120;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    .dashboard {
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      background: #151e30;
      border: 1px solid #293449;
      border-radius: 16px;
    }

    h1 { font-size: 23px; }

    select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #0b1120;
      color: white;
      font-size: 15px;
    }

    .status { color: #fbbf24; font-size: 14px; }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 8px;
      border-radius: 50%;
      background: #fbbf24;
    }

    .dot.connected { background: #22c55e; }
    .dot.disconnected { background: #ef4444; }

    .price {
      margin: 28px 0 12px;
      font-size: 38px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .muted { color: #9ca3af; font-size: 13px; }
    button { cursor: pointer; background: #24334c; }
  </style>
</head>
<body>
  <main class="dashboard">
    <h1>Live Price Dashboard</h1>

    <label for="market">Select market</label>
    <select id="market">
      <option value="Market A">Market A</option>
      <option value="Market B">Market B</option>
      <option value="Market C">Market C</option>
    </select>

    <p class="status">
      <span id="dot" class="dot"></span>
      <span id="status">Starting...</span>
    </p>

    <div id="price" class="price">--</div>
    <p class="muted" id="marketName">Market A</p>
    <p class="muted">Last update: <span id="updated">--</span></p>

    <button id="toggle">Pause updates</button>
    <p class="muted">Demo only — prices are simulated, not live market data.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
