<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Live Market</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #0b1220;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .dashboard {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border: 1px solid #263449;
      border-radius: 22px;
      background: #111c2e;
      box-shadow: 0 18px 55px #0005;
    }
    .brand {
      color: #36d6a5;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 6px;
      font-size: 27px;
    }
    .subtitle {
      margin: 0 0 26px;
      color: #96a8c0;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 9px;
      color: #b8c6d9;
      font-size: 13px;
    }
    select {
      width: 100%;
      padding: 15px;
      border: 1px solid #34465f;
      border-radius: 12px;
      outline: none;
      background: #0b1424;
      color: white;
      font-size: 15px;
    }
    .market-card {
      margin-top: 22px;
      padding: 22px;
      border: 1px solid #2b3c52;
      border-radius: 16px;
      background: #0b1424;
    }
    .market-name {
      color: #c3d0e0;
      font-size: 16px;
      font-weight: bold;
    }
    .symbol {
      margin-top: 7px;
      color: #8499b4;
      font-size: 13px;
    }
    .price-label {
      margin-top: 30px;
      color: #91a4bc;
      font-size: 13px;
    }
    .price {
      margin-top: 8px;
      font-size: clamp(34px, 9vw, 48px);
      font-weight: bold;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 22px;
      color: #c1cddd;
      font-size: 13px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f5b942;
      flex-shrink: 0;
    }
    .dot.connected {
      background: #36d6a5;
    }
    .dot.error {
      background: #ff6878;
    }
    .updated {
      margin-top: 12px;
      color: #8193ab;
      font-size: 12px;
    }
    .note {
      margin-top: 22px;
      color: #8193ab;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <div class="brand">Deriv Market Data</div>
    <h1>Live Price</h1>
    <p class="subtitle">Real-time market prices</p>
    <label for="marketSelect">Select market</label>
    <select id="marketSelect">
      <option value="1HZ25V">Volatility 25 (1s) Index</option>
      <option value="1HZ10V">Volatility 10 (1s) Index</option>
      <option value="1HZ15V">Volatility 15 (1s) Index</option>
      <option value="1HZ30V">Volatility 30 (1s) Index</option>
      <option value="1HZ50V">Volatility 50 (1s) Index</option>
      <option value="1HZ75V">Volatility 75 (1s) Index</option>
      <option value="1HZ90V">Volatility 90 (1s) Index</option>
      <option value="R_10">Volatility 10 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_100">Volatility 100 Index</option>
      <option value="BOOM1000">Boom 1000 Index</option>
      <option value="BOOM500">Boom 500 Index</option>
      <option value="CRASH1000">Crash 1000 Index</option>
      <option value="CRASH500">Crash 500 Index</option>
      <option value="stpRNG">Step Index</option>
      <option value="frxEURUSD">EUR/USD</option>
      <option value="frxGBPUSD">GBP/USD</option>
      <option value="frxUSDJPY">USD/JPY</option>
      <option value="cryBTCUSD">BTC/USD</option>
      <option value="cryETHUSD">ETH/USD</option>
      <option value="frxXAUUSD">Gold/USD</option>
    </select>
    <section class="market-card">
      <div class="market-name" id="marketName">Volatility 25 (1s) Index</div>
      <div class="symbol">Symbol: <span id="symbol">1HZ25V</span></div>
      <div class="price-label">Current price</div>
      <div class="price" id="price">Waiting...</div>
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span id="status">Connecting to market...</span>
      </div>
      <div class="updated">Last update: <span id="updated">—</span></div>
    </section>
    <p class="note">Read-only market data. This dashboard does not place trades.</p>
  </main>

  <script>
    const marketSelect = document.getElementById("marketSelect");
    const marketName = document.getElementById("marketName");
    const symbolElement = document.getElementById("symbol");
    const priceElement = document.getElementById("price");
    const statusElement = document.getElementById("status");
    const statusDot = document.getElementById("statusDot");
    const updatedElement = document.getElementById("updated");

    const APP_ID = "34GGk6VAHQWY2QDMsCKyZ";
    const SOCKET_URL = `wss://://derivws.com{APP_ID}`;

    let socket = null;
    let selectedSymbol = marketSelect.value;
    let subscriptionId = null;
    let requestNumber = 0;
    let reconnectTimer = null;
    let manuallyClosed = false;

    function setStatus(message, state = "connecting") {
      statusElement.textContent = message;
      statusDot.className = "dot";

      if (state === "connected") {
        statusDot.classList.add("connected");
      } else if (state === "error") {
        statusDot.classList.add("error");
      }
    }

    function sendRequest(request) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        return false;
      }
      socket.send(JSON.stringify(request));
      return true;
    }

    function getDecimalPlaces(pipSize) {
      if (!Number.isFinite(pipSize) || pipSize <= 0) {
        return 2;
      }

      const text = pipSize.toString();
      if (text.includes("e-")) {
        return Math.min(10, Number(text.split("e-")[1]));
      }
      if (text.includes(".")) {
        return Math.min(10, text.split(".")[1].length);
      }
      return 0;
    }

    function subscribeToMarket(symbol) {
      const previousSubscription = subscriptionId;
      subscriptionId = null;
      selectedSymbol = symbol;

      priceElement.textContent = "Loading...";
      updatedElement.textContent = "—";

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        setStatus("Waiting for connection...");
        return;
      }

      if (previousSubscription) {
        sendRequest({ forget: previousSubscription });
      }

      const reqId = ++requestNumber;
      setStatus(`Loading ${symbol}...`);

      sendRequest({
        ticks: symbol,
        subscribe: 1,
        req_id: reqId
      });
    }

    function updateSelectedMarket() {
      const option = marketSelect.options[marketSelect.selectedIndex];
      if (!option) return;

      marketName.textContent = option.textContent;
      symbolElement.textContent = marketSelect.value;

      subscribeToMarket(marketSelect.value);
    }

    function connect() {
      clearTimeout(reconnectTimer);
      setStatus("Connecting to Deriv...");

      try {
        socket = new WebSocket(SOCKET_URL);
      } catch (error) {
        console.error("WebSocket creation failed:", error);
        setStatus("Could not connect", "error");
        reconnectTimer = setTimeout(connect, 5000);
        return;
      }

      socket.addEventListener("open", () => {
        setStatus("Connected — requesting price");
        subscribeToMarket(selectedSymbol);
      });

      socket.addEventListener("message", (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (error) {
          console.error("Invalid server response:", error);
          return;
        }

        if (data.error) {
          console.error("Deriv API error:", data.error);
          setStatus(data.error.message || "API request failed", "error");

          if (data.req_id === requestNumber) {
            priceElement.textContent = "Unavailable";
          }
          return;
        }

        if (data.subscription?.id && data.tick?.symbol === selectedSymbol) {
          subscriptionId = data.subscription.id;
        }

        if (data.msg_type !== "tick" || !data.tick) {
          return;
        }

        if (data.tick.symbol !== selectedSymbol) {
          return;
        }

        const quote = Number(data.tick.quote);
        if (!Number.isFinite(quote)) {
          setStatus("Invalid price received", "error");
          return;
        }

        const decimals = getDecimalPlaces(Number(data.tick.pip_size));
        priceElement.textContent = quote.toFixed(decimals);
        updatedElement.textContent = new Date().toLocaleTimeString();
        setStatus("Live price connected", "connected");
      });

      socket.addEventListener("error", () => {
        setStatus("Connection error — check API setup", "error");
      });

      socket.addEventListener("close", () => {
        subscriptionId = null;
        if (!manuallyClosed) {
          setStatus("Disconnected — reconnecting...", "error");
          reconnectTimer = setTimeout(connect, 3000);
        }
      });
    }

    marketSelect.addEventListener("change", updateSelectedMarket);

    window.addEventListener("beforeunload", () => {
      manuallyClosed = true;
      clearTimeout(reconnectTimer);

      if (socket && socket.readyState === WebSocket.OPEN) {
        if (subscriptionId) {
          sendRequest({ forget: subscriptionId });
        }
        socket.close();
      }
    });

    updateSelectedMarket();
    connect();
  </script>
</body>
</html>
