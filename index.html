<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Connection Test</title>
  <style>
    body {
      background: #0b1220;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
      text-align: center;
    }
    h1 { margin-bottom: 10px; }
    .status {
      margin: 20px 0;
      font-size: 18px;
      padding: 12px 20px;
      border-radius: 10px;
      display: inline-block;
    }
    .connecting { background: #3a2e10; color: #f5b942; }
    .connected { background: #0f2e22; color: #36d6a5; }
    .error { background: #3a1518; color: #ff6878; }
    .price {
      font-size: 48px;
      font-weight: bold;
      margin: 30px 0;
      font-variant-numeric: tabular-nums;
    }
    .log {
      margin-top: 40px;
      text-align: left;
      background: #111c2e;
      border: 1px solid #263449;
      border-radius: 12px;
      padding: 16px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
    }
    .log div { margin-bottom: 6px; color: #96a8c0; }
  </style>
</head>
<body>
  <h1>Deriv Connection Test</h1>
  <p>Symbol: <strong>1HZ25V</strong> (Volatility 25 1s)</p>

  <div class="status connecting" id="status">Connecting...</div>
  <div class="price" id="price">—</div>
  <div id="digit">Last digit: —</div>

  <div class="log" id="log"></div>

  <script>
    const statusEl = document.getElementById("status");
    const priceEl = document.getElementById("price");
    const digitEl = document.getElementById("digit");
    const logEl = document.getElementById("log");

    function log(msg) {
      const d = document.createElement("div");
      d.textContent = new Date().toLocaleTimeString() + " → " + msg;
      logEl.prepend(d);
      console.log(msg);
    }

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    const endpoints = [
      "wss://ws.derivws.com/websockets/v3?app_id=1089",
      "wss://api.derivws.com/trading/v1/options/ws/public"
    ];

    let index = 0;
    let socket = null;

    function connect() {
      if (socket) {
        try { socket.close(); } catch(e) {}
      }

      const url = endpoints[index];
      log("Trying: " + url);
      setStatus("Connecting to " + (index === 0 ? "Legacy" : "New") + " endpoint...", "connecting");

      try {
        socket = new WebSocket(url);
      } catch (e) {
        log("Failed to create WebSocket: " + e.message);
        setStatus("WebSocket not supported", "error");
        return;
      }

      socket.onopen = function() {
        log("✅ OPENED successfully");
        setStatus("Connected! Waiting for ticks...", "connected");

        // Subscribe
        socket.send(JSON.stringify({
          ticks: "1HZ25V",
          subscribe: 1
        }));
        log("Sent subscription for 1HZ25V");
      };

      socket.onmessage = function(event) {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (e) {
          log("Parse error");
          return;
        }

        if (data.error) {
          log("API Error: " + JSON.stringify(data.error));
          setStatus("API Error: " + (data.error.message || "Unknown"), "error");
          return;
        }

        if (data.msg_type === "tick" && data.tick) {
          const quote = data.tick.quote;
          const digit = String(quote).replace(".", "").slice(-1);
          priceEl.textContent = Number(quote).toFixed(2);
          digitEl.textContent = "Last digit: " + digit;
          setStatus("LIVE — receiving ticks", "connected");
          log("Tick: " + quote + " | digit " + digit);
        }
      };

      socket.onerror = function() {
        log("❌ Error event");
        setStatus("Connection error", "error");
      };

      socket.onclose = function(e) {
        log("Closed (code " + e.code + ")");
        setStatus("Disconnected", "error");

        // Try next endpoint
        index = (index + 1) % endpoints.length;
        setTimeout(connect, 2000);
      };
    }

    // Start
    log("Page loaded. Starting connection test...");
    connect();
  </script>
</body>
</html>
